<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提交百科修改</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="wiki.css"></head><body class="wiki-page"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">Telegram</span><span>Telegram <small>中国区论坛</small></span></a><nav><a href="index.html">首页</a><a href="wiki.html">电报中国百科</a><a data-auth-nav href="auth.html">登录 / 注册</a></nav><button class="menu-button" aria-label="打开导航菜单">☰</button></header><main class="wiki-shell"><form class="wiki-form" data-edit-form><p class="eyebrow">WIKI CONTRIBUTION</p><h1>提交词条修改</h1><p class="wiki-note">提交后不会直接公开。管理员审核通过后，内容才会更新至百科。</p><label>词条标题</label><input name="title" required maxlength="80" placeholder="例如：电报中国百科"><label>词条网址标识</label><input name="slug" required maxlength="80" pattern="[a-z0-9-]{3,80}" placeholder="例如：telegram-china-wiki"><label>分类</label><input name="category" required maxlength="40" value="综合"><label>摘要</label><textarea name="summary" maxlength="280" placeholder="用一句至数句简要说明词条。"></textarea><label>正文</label><textarea name="content" required maxlength="30000" placeholder="请以客观、可核实的方式填写正文内容。"></textarea><label>修改说明（可选）</label><textarea name="edit_note" maxlength="500" placeholder="例如：补充公开资料中的职责介绍。"></textarea><button class="wiki-button" type="submit">提交审核</button><p class="wiki-status" data-status></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="wiki-edit.js"></script><script src="script.js"></script></body></html>

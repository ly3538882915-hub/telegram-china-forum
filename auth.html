<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>登录或注册 · Telegram 中国区论坛</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="auth.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✈</span><span>Telegram <small>中国区论坛</small></span></a><nav><a href="index.html">首页</a><a href="leadership.html">党务人员</a><a href="executives.html">企业高层</a></nav><button class="menu-button" aria-label="打开导航菜单">☰</button></header><main class="auth-shell" data-auth-page><section class="auth-card"><h1>欢迎回来</h1><p class="auth-intro">登录或创建账户，加入 Telegram 中国区社区。</p><div class="auth-switcher"><button type="button" data-auth-switch="login">登录</button><button type="button" data-auth-switch="signup">注册</button></div><p class="form-message" data-auth-message aria-live="polite"></p><form class="auth-form" data-auth-panel="login" data-login-form><label>邮箱地址<input name="email" type="email" autocomplete="email" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button class="auth-submit" type="submit">登录</button><button class="auth-link" type="button" data-auth-switch="reset">忘记密码？</button></form><form class="auth-form" data-auth-panel="signup" data-signup-form hidden><label>用户名<input name="username" type="text" minlength="2" maxlength="32" autocomplete="username" required></label><label>邮箱地址<input name="email" type="email" autocomplete="email" required></label><label>密码（至少 8 位）<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>确认密码<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><button class="auth-submit" type="submit">创建账户</button></form><form class="auth-form" data-auth-panel="reset" data-reset-form hidden><label>注册邮箱<input name="email" type="email" autocomplete="email" required></label><button class="auth-submit" type="submit">发送重置邮件</button><button class="auth-link" type="button" data-auth-switch="login">返回登录</button></form><form class="auth-form" data-auth-panel="update" data-update-form hidden><label>新密码（至少 8 位）<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><button class="auth-submit" type="submit">更新密码</button></form></section></main><footer><a class="brand" href="index.html"><span class="brand-mark small">✈</span><span>Telegram <small>中国区论坛</small></span></a><span>© 2026 Telegram China Community</span></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script src="script.js"></script></body></html>
